name: Pass It Down
description: >-
  Pass It Down is a Chattanooga, Tennessee digital storytelling company that helps
  museums, libraries, universities, sports organizations, brands, and nonprofits
  build interactive online exhibits, digital collections, timelines, and cloud-based
  touchscreen kiosks. Its stated mission is that every organization should be able to
  build Smithsonian-quality exhibits in minutes for a fraction of the cost. Related
  properties include Iconic Moments (a cultural-heritage NFT marketplace) and a
  sports-storytelling offering. The company was surfaced as a Techstars portfolio
  company and added to the API Evangelist network. As of this enrichment pass Pass It
  Down publishes a marketing/product website but no public developer API, documentation,
  SDKs, packages, or other machine-readable surface.
